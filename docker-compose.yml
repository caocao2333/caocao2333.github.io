services:
  jekyll:
    build: .
    ports:
      - "4000:4000"
    volumes:
      - ./:/usr/src/app
    environment:
      - JEKYLL_ENV=development
    command: >-
      bundle exec jekyll serve
      --host 0.0.0.0
      --watch
      --force_polling
      --config _config.yml,_config.dev.yml
    restart: unless-stopped
